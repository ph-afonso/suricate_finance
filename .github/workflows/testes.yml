# Pipeline de testes (issue #94, seção 10 da documentação técnica do M1).
# - api e front: em todo PR e em todo push para develop, staging e main
# - e2e: quando a Vercel termina um deploy (preview ou produção), contra o endereço publicado
name: Testes

on:
  pull_request:
  push:
    branches: [develop, staging, main]
  deployment_status:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.deployment.id || github.sha }}
  cancel-in-progress: true

jobs:
  api:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: suricate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/suricate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (Postgres 16)
        run: pytest

  front:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint e Prettier
        run: |
          npm run lint
          npm run format:check
      - name: Vitest
        run: npm test
      - name: Build PWA
        run: npm run build
      - name: Manifesto e service worker do PWA (CT10)
        run: npm run verificar:pwa

  e2e:
    # Só deploys da Vercel: as Actions de migração também criam deployments (ambientes do GitHub)
    if: >-
      github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
      && contains(github.event.deployment_status.environment_url, '.vercel.app')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Ambiente esperado para o ramo do deploy (CT12, CT13)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
          ALVO: ${{ github.event.deployment.environment }}
        run: |
          if [ "$ALVO" = "Production" ]; then ambiente="Produção"
          else
            ramos=$(gh api "repos/${{ github.repository }}/commits/$SHA/branches-where-head" --jq '.[].name' || true)
            if echo "$ramos" | grep -qx staging; then ambiente="Pré-produção"
            elif [ -n "$ramos" ]; then ambiente="Desenvolvimento"
            fi
          fi
          echo "Ramos: ${ramos:-?} -> ambiente esperado: ${ambiente:-não verificado}"
          echo "E2E_AMBIENTE=${ambiente}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (360 px e 1440 px)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-e2e
          path: e2e/playwright-report
          retention-days: 7
