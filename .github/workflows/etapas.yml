# Fluxo de aprovação por etapas.
#
# - PR aberto que fecha uma issue ("Closes #12"): a issue sai de "pronta-para-claude"
#   e vai para "aguardando-aprovacao".
# - Issue de etapa fechada (pelo merge do PR, que é a aprovação do Phelipe): a próxima
#   etapa do mesmo milestone recebe "pronta-para-claude". Ao fechar a etapa 4, o módulo
#   e o milestone são fechados e a etapa 1 do próximo milestone (M0, M1, ... M8) é liberada.
name: Etapas

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  pr-aberto:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const nums = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|fecha)\s+#(\d+)/gi)].map(m => Number(m[1]));
            for (const issue_number of new Set(nums)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number, name: 'pronta-para-claude' }).catch(() => {});
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['aguardando-aprovacao'] });
            }

  etapa-aprovada:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ORDEM = ['etapa:doc-tecnica', 'etapa:dev', 'etapa:teste', 'etapa:doc-uso'];
            const issue = context.payload.issue;
            const etapa = issue.labels.map(l => l.name).find(n => ORDEM.includes(n));
            if (!etapa || !issue.milestone) return;

            await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: 'aguardando-aprovacao' }).catch(() => {});

            const doMilestone = async (milestone) => github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, milestone: String(milestone.number), state: 'all', per_page: 100 });

            const liberar = async (alvo, msg) => {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: alvo.number, labels: ['pronta-para-claude'] });
              await github.rest.issues.createComment({ ...context.repo, issue_number: alvo.number, body: msg });
            };

            const itens = await doMilestone(issue.milestone);
            const proxima = ORDEM[ORDEM.indexOf(etapa) + 1];
            if (proxima) {
              const alvo = itens.find(i => !i.pull_request && i.state === 'open' && i.labels.some(l => l.name === proxima));
              if (alvo) await liberar(alvo, `Etapa anterior aprovada em #${issue.number}. Esta etapa está liberada para o Claude.`);
              return;
            }

            // Etapa 4 aprovada: fecha o módulo e o milestone, libera o próximo milestone.
            const modulo = itens.find(i => !i.pull_request && i.state === 'open' && i.labels.some(l => l.name === 'modulo'));
            if (modulo) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: modulo.number, body: 'As 4 etapas foram aprovadas. Módulo concluído.' });
              await github.rest.issues.update({ ...context.repo, issue_number: modulo.number, state: 'closed' });
            }
            await github.rest.issues.updateMilestone({ ...context.repo, milestone_number: issue.milestone.number, state: 'closed' });

            const codigo = t => { const m = /^M(\d+)\b/.exec(t); return m ? Number(m[1]) : null; };
            const atual = codigo(issue.milestone.title);
            if (atual === null) return;
            const abertos = await github.paginate(github.rest.issues.listMilestones, { ...context.repo, state: 'open', per_page: 100 });
            const seguinte = abertos.find(m => codigo(m.title) === atual + 1);
            if (!seguinte) return;
            const primeira = (await doMilestone(seguinte)).find(i => !i.pull_request && i.state === 'open' && i.labels.some(l => l.name === ORDEM[0]));
            if (primeira) await liberar(primeira, `O milestone "${issue.milestone.title}" foi concluído. Esta etapa está liberada para o Claude.`);
